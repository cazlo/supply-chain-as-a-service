# Thin clean-snapshot validation for the vendored Artifact Keeper sources.
#
# This is the no-secret pull-request gate: it checks out the repository and runs
# the fast `make source-check` gates (backend builder stage, web build stage, and
# strict Helm lint/render) on a repository-scoped builder runner. It deliberately
# carries no Harbor push, signing, or registration secrets so that untrusted or
# dependency-generated branches can run it safely.
#
# Requirements before this can pass:
#   - A repository-scoped runner advertising the `artifact-keeper-builder` label
#     (see apps/gitea-runners in the GitOps repository).
#   - A BuildKit-capable build backend reachable from the job (rootless BuildKit
#     daemon or isolated DinD); the host containerd socket must NOT be mounted.
#   - actions/checkout available to the Gitea instance (mirror or proxy).
#
# The heavier `make source-smoke` compose suite is intentionally excluded here;
# it belongs to a separate, non-PR validation lane.

name: validate

on:
  workflow_dispatch:
  push:
    paths:
      - "artifact-keeper/**"
      - "artifact-keeper-web/**"
      - "artifact-keeper-iac/**"
      - "ci/**"
      - "Makefile"
      - ".gitea/workflows/validate.yml"
  pull_request:
    paths:
      - "artifact-keeper/**"
      - "artifact-keeper-web/**"
      - "artifact-keeper-iac/**"
      - "ci/**"
      - "Makefile"
      - ".gitea/workflows/validate.yml"

jobs:
  source-check:
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@v4

      - name: Clean-snapshot source checks
        run: make source-check
