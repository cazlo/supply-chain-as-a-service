name: Compose runner canary

# Trusted-maintainer, manual-only validation for the supplemental Podman runner.
# This workflow has no publishing/deployment secrets and is intentionally not
# triggered by pull_request or push events.
on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Script-enforced timeout (seconds)
        required: true
        default: "1500"
        type: string

jobs:
  compose-playwright:
    runs-on: artifact-keeper-compose
    timeout-minutes: 30
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prove Compose and focused Playwright compatibility
        run: ci/compose-runner-canary.sh
        env:
          COMPOSE_CANARY_TIMEOUT_SECONDS: ${{ gitea.event.inputs.timeout_seconds }}

      - name: Enforce cleanup after failure or cancellation
        if: always()
        run: ci/compose-runner-canary.sh --cleanup-only

      - name: Retain Playwright, Compose, and cleanup evidence
        if: always()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: compose-runner-canary-${{ gitea.run_id }}
          path: .artifacts/compose-runner/
          if-no-files-found: warn
          retention-days: 14
