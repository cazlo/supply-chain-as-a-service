# Release-promotion lane. Runs on merge to main and copies the images that
# already passed the PR's publish+smoke+sign lane (and were pushed to
# artifact-keeper-staging) into the artifact-keeper-release project — by digest,
# no rebuild. cosign copy carries the signature, so a `repo:tag@sha256:` pin and
# `cosign verify` both still hold against ci/cosign.pub in the release project.
#
# The staged image is re-found by its source key (ci/source-key.sh), which is
# derived from committed state only and is therefore identical on the PR head and
# on the post-merge commit. The run prints the release digests to pin in the Flux
# deploy (apps/artifact-keeper/release.yaml in the GitOps repo).
#
# Path-filtered to mirror publish-ci: a docs-only merge neither built nor staged
# anything, so it must not try to promote.

name: promote-release

on:
  push:
    branches: [main]
    paths:
      - "artifact-keeper/**"
      - "artifact-keeper-web/**"
      - "artifact-keeper-iac/**"
      - "ci/**"
      - "vendor/upstreams.tsv"
      - "Makefile"
      - ".gitea/workflows/promote-release.yml"

jobs:
  promote-release:
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # cosign as a native binary (daemonless runners). No-op once baked into the
      # runner image (apps/gitea-runners/runner-image in the GitOps repo).
      - name: Set up cosign and trivy
        run: ci/setup-image-tools.sh

      - name: Promote backend + web to release (staging -> release, by digest)
        run: |
          {
            ci/promote-to-release.sh backend
            ci/promote-to-release.sh web
          } | tee /tmp/release-pins.env
          echo "::notice::release pins -> $(tr '\n' ' ' </tmp/release-pins.env)"
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Retain the release pins
        # The pins are the hand-off to the GitOps repo's release.yaml digest bump.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: release-pins-${{ gitea.sha }}
          path: /tmp/release-pins.env
          if-no-files-found: error
          retention-days: 30
