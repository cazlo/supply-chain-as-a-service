# Primary build/publish lane. Runs on every PR (and on manual dispatch) so all
# proposed changes get a full build, chart-lint, push-to-Harbor, and k8s smoke
# before merging. Backend and web are independent jobs so the two
# repository-scoped runners build in parallel; only the backend job continues
# into the registry smoke.

name: publish-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "artifact-keeper/**"
      - "artifact-keeper-web/**"
      - "artifact-keeper-iac/**"
      - "ci/**"
      - "Makefile"
      - ".gitea/workflows/publish-ci.yml"

jobs:
  backend-build-smoke:
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and publish backend
        run: ci/build-images.sh backend
        env:
          BUILD_OUTPUT_DIR: /tmp/artifact-keeper-backend-record
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      # Host-mode actions execute from the action cache, not necessarily the
      # checkout directory. Use an absolute path so upload-artifact sees it.
      - name: Retain the backend build record
        # Gitea 1.26 implements the v3 artifact protocol; v4 detects the
        # self-hosted endpoint as GHES and refuses to upload.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: backend-build-record-${{ gitea.sha }}
          path: /tmp/artifact-keeper-backend-record/
          if-no-files-found: error
          retention-days: 14

      - name: Lint and dry-run the vendored Helm chart
        run: make source-check-chart

      - name: Smoke the freshly published backend by digest
        run: |
          set -a
          . /tmp/artifact-keeper-backend-record/images.env
          set +a
          export BACKEND_IMAGE_REPO="${BACKEND_IMAGE}"
          export BACKEND_IMAGE_TAG="${BACKEND_TAG}@${BACKEND_DIGEST}"
          make source-smoke
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  web-build:
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and publish web
        run: ci/build-images.sh web
        env:
          BUILD_OUTPUT_DIR: /tmp/artifact-keeper-web-record
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Retain the web build record
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: web-build-record-${{ gitea.sha }}
          path: /tmp/artifact-keeper-web-record/
          if-no-files-found: error
          retention-days: 14
