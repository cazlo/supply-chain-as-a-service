# Primary build/publish lane. Runs on every PR, on manual dispatch, and when a
# trusted maintainer comments `/deploy smoke` on a PR.
#
# Two modes, decided by the `gate` job:
#   * publish  (humans / workflow_dispatch): build -> push -> Trivy scan ->
#     cosign sign -> verify-before-smoke -> k8s smoke. Harbor + cosign secrets
#     are referenced only by these steps.
#   * validate (bot-authored PRs, e.g. the upstream-sync bot): secretless build
#     and chart-lint only. Untrusted/auto-generated source never receives Harbor
#     push/signing secrets and is never deployed without human review.
#   * ChatOps publish: `/deploy smoke` resolves the PR's immutable head SHA and
#     reruns the publish path after checking that the commenter has write access.
#
# Backend and web are independent jobs so the two repository-scoped runners build
# in parallel; only the backend job continues into the registry smoke.

name: publish-ci

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - "artifact-keeper/**"
      - "artifact-keeper-web/**"
      - "artifact-keeper-iac/**"
      - "ci/**"
      - "Makefile"
      - ".gitea/workflows/publish-ci.yml"

jobs:
  gate:
    runs-on: artifact-keeper-builder
    permissions:
      code: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      publish: ${{ steps.decide.outputs.publish }}
      checkout_ref: ${{ steps.decide.outputs.checkout_ref }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Check out the gate implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide publish vs validate-only
        id: decide
        env:
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
          GITEA_EVENT_ACTION: ${{ gitea.event.action }}
          GITEA_EVENT_SHA: ${{ gitea.sha }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          PR_AUTHOR: ${{ gitea.event.pull_request.user.login }}
          PR_NUMBER: ${{ gitea.event.issue.number }}
          COMMENT_AUTHOR: ${{ gitea.event.sender.login }}
          COMMENT_BODY: ${{ gitea.event.comment.body }}
          CHATOPS_DEPLOYERS: ${{ vars.CHATOPS_DEPLOYERS }}
          # The machine identity whose PRs must not auto-publish or deploy.
          BOT_LOGIN: supply-chain-sync
        run: ci/publish-gate.sh

  backend-build-smoke:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      # ---- validate-only path (bot PRs): no secrets, no push ----
      - name: Validate backend and chart (no publish)
        if: needs.gate.outputs.publish != 'true'
        run: |
          make source-check-backend
          make source-check-chart

      # ---- publish path (humans / manual dispatch) ----
      - name: Build and publish backend
        if: needs.gate.outputs.publish == 'true'
        run: ci/build-images.sh backend
        env:
          BUILD_OUTPUT_DIR: /tmp/artifact-keeper-backend-record
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      # The runners are daemonless (no `docker run`); cosign/trivy are native
      # binaries. Install them here until they are baked into the runner image
      # (apps/gitea-runners/runner-image), at which point this is a no-op.
      - name: Set up cosign and trivy
        if: needs.gate.outputs.publish == 'true'
        run: ci/setup-image-tools.sh

      - name: Scan the backend image (Trivy)
        if: needs.gate.outputs.publish == 'true'
        run: ci/scan-image.sh /tmp/artifact-keeper-backend-record/backend-record.json
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Sign the backend image (cosign)
        if: needs.gate.outputs.publish == 'true'
        run: ci/sign-image.sh /tmp/artifact-keeper-backend-record/backend-record.json
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Retain the backend build record
        if: needs.gate.outputs.publish == 'true'
        # Gitea 1.26 implements the v3 artifact protocol; v4 detects the
        # self-hosted endpoint as GHES and refuses to upload.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: backend-build-record-${{ needs.gate.outputs.checkout_ref }}
          path: /tmp/artifact-keeper-backend-record/
          if-no-files-found: error
          retention-days: 14

      - name: Verify signature, then smoke the backend by digest
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -a
          . /tmp/artifact-keeper-backend-record/images.env
          set +a
          # Verify-before-deploy: refuse to smoke an image the lab did not sign.
          ci/verify-image.sh "${BACKEND_IMAGE}@${BACKEND_DIGEST}"
          export BACKEND_IMAGE_REPO="${BACKEND_IMAGE}"
          export BACKEND_IMAGE_TAG="${BACKEND_TAG}@${BACKEND_DIGEST}"
          make source-smoke
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      # Smoke passed: promote the exact signed digest into artifact-keeper-staging
      # (cosign copy carries the signature; the digest is preserved). Tagged with
      # the full build tag for traceability and the reconstructable source key
      # (ci/source-key.sh) that the merge-to-main release lane re-finds it by.
      - name: Promote the backend to staging
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -a
          . /tmp/artifact-keeper-backend-record/images.env
          set +a
          staging_repo="${HARBOR_REGISTRY}/artifact-keeper-staging/artifact-keeper-backend"
          ci/promote-image.sh \
            "${BACKEND_IMAGE}@${BACKEND_DIGEST}" \
            "${staging_repo}" \
            "${BACKEND_TAG}" "$(ci/source-key.sh backend)"
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  backend-coverage:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources with coverage history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Run upstream-equivalent coverage gates
        run: ci/backend-quality-k8s.sh
        env:
          QUALITY_MODE: coverage
          QUALITY_RESULTS_DIR: /tmp/artifact-keeper-coverage

      - name: Retain coverage log and LCOV report
        if: always()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: backend-coverage-${{ needs.gate.outputs.checkout_ref }}
          path: /tmp/artifact-keeper-coverage/
          if-no-files-found: warn
          retention-days: 14

  # Compile every backend/tests/*.rs integration-test binary ONCE
  # (ci/local-ci/Dockerfile.runner's test-artifacts stage) and push the
  # result to Harbor. backend-integration below pulls this single image for
  # every matrix leg instead of each leg separately recompiling the whole
  # dev-dependency graph via docker buildx build -- that redundant
  # per-leg compile was the original design's main cost (~2m/leg even with
  # warm cargo caches, serialized further by shared-mount lock contention
  # under concurrent legs).
  backend-integration-build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: artifact-keeper-builder
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Build and push the backend test-runner image
        id: build
        # Two statements, not `echo "image=$(script)"`: with the build
        # inlined as an argument, its exit code is swallowed (the outer
        # echo still succeeds), so a failed build silently reports success
        # with a garbage image ref -- exactly what happened the one time
        # this was written that way in the staging branch.
        run: |
          set -euo pipefail
          image="$(ci/backend-test-image-build.sh)"
          echo "image=${image}" >> "${GITEA_OUTPUT}"
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

  # Postgres-backed `backend/tests/*.rs` suites that `cargo test --lib` (the
  # backend-coverage job above) does not build or run. Upstream's own
  # .github/workflows/ci.yml enumerates the same Postgres-only-safe subset by
  # name in its "Backend Integration Tests" job; this list mirrors that one.
  # Deliberately excluded, same reasoning as upstream: azure_rbac_live_test,
  # azure_shared_key_live_test, s3_integration (need live cloud creds),
  # integration_tests / replication_integration /
  # tag_filtered_replication_tests / storage_backend_tests (need a running
  # HTTP backend), incus_upload_tests (most cases panic without the
  # optional_auth middleware wired in; only one case runs upstream via a
  # named test filter, not covered here).
  #
  # Each leg runs ci/backend-integration-run-k8s.sh: stand up one ephemeral
  # Postgres deployment (named after the test target so concurrent legs
  # never collide in the shared ak-smoke namespace) and a k8s Job that pulls
  # backend-integration-build's already-compiled image and runs exactly one
  # pre-built test binary -- no per-leg BuildKit compile at all. That makes
  # legs cheap enough to run with much higher concurrency than the old
  # BuildKit-per-leg design could afford.
  backend-integration:
    needs: [gate, backend-integration-build]
    if: needs.gate.outputs.run == 'true'
    runs-on: artifact-keeper-builder
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        test:
          - lifecycle_policy_tests
          - api_token_cache_flush_tests
          - grpc_sbom_tests
          - search_reindex_tests
          - scan_convert_to_reused_tests
          - stuck_scan_janitor_tests
          - virtual_members_atomicity_test
          - virtual_members_duplicate_test
          - oci_chunked_upload_cross_repo_tests
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Run ${{ matrix.test }} (Postgres-backed, --ignored)
        run: ci/backend-integration-run-k8s.sh
        env:
          TEST: ${{ matrix.test }}
          TEST_RUNNER_IMAGE: ${{ needs.backend-integration-build.outputs.image }}
          QUALITY_RESULTS_DIR: /tmp/artifact-keeper-integration-${{ matrix.test }}
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Retain integration log
        if: always()
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: backend-integration-${{ matrix.test }}-${{ needs.gate.outputs.checkout_ref }}
          path: /tmp/artifact-keeper-integration-${{ matrix.test }}/
          if-no-files-found: warn
          retention-days: 14

  web-build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: artifact-keeper-builder
    steps:
      - name: Check out the vendored sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      # ---- validate-only path (bot PRs): no secrets, no push ----
      - name: Validate web (no publish)
        if: needs.gate.outputs.publish != 'true'
        run: make source-check-web

      # ---- publish path (humans / manual dispatch) ----
      - name: Build and publish web
        if: needs.gate.outputs.publish == 'true'
        run: ci/build-images.sh web
        env:
          BUILD_OUTPUT_DIR: /tmp/artifact-keeper-web-record
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up cosign and trivy
        if: needs.gate.outputs.publish == 'true'
        run: ci/setup-image-tools.sh

      - name: Scan the web image (Trivy)
        if: needs.gate.outputs.publish == 'true'
        run: ci/scan-image.sh /tmp/artifact-keeper-web-record/web-record.json
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Sign the web image (cosign)
        if: needs.gate.outputs.publish == 'true'
        run: ci/sign-image.sh /tmp/artifact-keeper-web-record/web-record.json
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Retain the web build record
        if: needs.gate.outputs.publish == 'true'
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: web-build-record-${{ needs.gate.outputs.checkout_ref }}
          path: /tmp/artifact-keeper-web-record/
          if-no-files-found: error
          retention-days: 14

      # The web image has no client smoke; signing is its gate. Promote the signed
      # digest into artifact-keeper-staging (see the backend step for the model).
      - name: Promote the web image to staging
        if: needs.gate.outputs.publish == 'true'
        run: |
          set -a
          . /tmp/artifact-keeper-web-record/images.env
          set +a
          staging_repo="${HARBOR_REGISTRY}/artifact-keeper-staging/artifact-keeper-web"
          ci/promote-image.sh \
            "${WEB_IMAGE}@${WEB_DIGEST}" \
            "${staging_repo}" \
            "${WEB_TAG}" "$(ci/source-key.sh web)"
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
