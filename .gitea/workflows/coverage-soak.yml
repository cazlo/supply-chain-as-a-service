# Coverage-only soak lane for flake hunting. Dispatch this N times against a
# staging soak branch to repeat the upstream-equivalent coverage gate without
# the publish/scan/sign/smoke path (no secrets, no Harbor, no cluster deploy).
# Lives only on soak branches; never merge to main. Mirrors publish-ci's
# backend-coverage job exactly so a soak run is the same signal as a PR run.
name: coverage-soak

on:
  workflow_dispatch:

jobs:
  backend-coverage:
    runs-on: artifact-keeper-builder
    # Solo runs complete in ~7 minutes; anything past 8 means overlap,
    # a cold rebuild, or a wedge (run 357's hang burned a slot for hours;
    # run 411's lld deadlock needed a manual kill). Kill it and move on —
    # nobody is babysitting these batches.
    timeout-minutes: 8
    steps:
      - name: Check out the vendored sources with coverage history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run upstream-equivalent coverage gates
        run: ci/backend-quality-k8s.sh
        env:
          QUALITY_MODE: coverage
          QUALITY_RESULTS_DIR: /tmp/artifact-keeper-coverage
          # 16-thread experiment (2026-07-06 plan): overrides the image-baked 8.
          COVERAGE_TEST_THREADS: "16"

      - name: Retain coverage log and LCOV report
        if: always()
        # Gitea 1.26 implements the v3 artifact protocol; v4 detects the
        # self-hosted endpoint as GHES and refuses to upload.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: backend-coverage-soak-${{ gitea.run_number }}
          path: /tmp/artifact-keeper-coverage/
          if-no-files-found: warn
          retention-days: 14
